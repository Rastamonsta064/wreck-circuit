<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#87929e">
  <meta name="description" content="Wreck Circuit v0.5 — кузов, следы шин и звуки">
  <title>Wreck Circuit — Visual & Audio Effects v0.5</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: #87929e; }
    body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    #app { position: fixed; inset: 0; overflow: hidden; }
    #game { display: block; width: 100%; height: 100%; touch-action: none; }
    .hud { position: absolute; z-index: 2; inset: 0 0 auto; display: flex; align-items: flex-start; justify-content: space-between; padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left)); pointer-events: none; }
    .speed-card { display: flex; gap: 7px; align-items: baseline; padding: 8px 13px 9px; background: rgba(18,27,36,.8); color: white; border: 1px solid rgba(255,255,255,.15); border-radius: 11px; box-shadow: 0 3px 10px #0002; font-variant-numeric: tabular-nums; }
    .speed-number { font-size: clamp(22px, 3.2vw, 31px); font-weight: 800; line-height: 1; min-width: 36px; text-align: right; }
    .speed-unit { font-size: 10px; color: #dae1e8; font-weight: 650; }
    .gear { font-size: 11px; color: #f9c45e; font-weight: 800; border-left: 1px solid #677380; padding-left: 8px; }
    .version { font-size: 9px; color: #c5ced8; font-weight: 650; padding-left: 3px; }
    .restart { pointer-events: auto; border: 1px solid rgba(255,255,255,.15); border-radius: 11px; color: white; background: rgba(18,27,36,.8); padding: 12px 14px; font: 700 13px system-ui,sans-serif; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .restart:active { background: #344454; }
    .hud-actions { display: flex; align-items: flex-start; gap: 7px; pointer-events: auto; }
    .audio-toggle { white-space: nowrap; }
    .audio-toggle[aria-pressed="false"] { color: #bbc5ce; background: rgba(18,27,36,.6); }
    .help { z-index: 2; position: absolute; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: rgba(18,27,36,.6); color: #fff; border-radius: 9px; padding: 9px 14px; white-space: nowrap; font-size: 12px; pointer-events: none; }
    .touch-controls { position: absolute; z-index: 3; bottom: max(15px, env(safe-area-inset-bottom)); left: max(16px, env(safe-area-inset-left)); right: max(16px, env(safe-area-inset-right)); display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; pointer-events: none; }
    .group { display: flex; align-items: flex-end; gap: clamp(6px, 1.5vw, 13px); pointer-events: none; }
    .ctrl { --h: clamp(58px, 12vh, 82px); pointer-events: auto; display: flex; justify-content: center; align-items: center; width: clamp(58px, 12vw, 82px); height: var(--h); border-radius: 15px; color: #fff; border: 2px solid rgba(255,255,255,.32); background: rgba(25,34,46,.72); box-shadow: 0 4px 10px #0003; font: 800 19px system-ui,sans-serif; touch-action: none; -webkit-tap-highlight-color: transparent; cursor: pointer; padding: 0; }
    .ctrl.gas { height: calc(var(--h) + 15px); background: rgba(55,100,61,.78); font-size: 13px; }
    .ctrl.brake { font-size: 11px; background: rgba(128,72,54,.82); }
    .ctrl.handbrake { font-size: 15px; }
    .ctrl.pressed, .ctrl:active { background: rgba(240,176,59,.93); color: #19212b; transform: translateY(2px); border-color: #fff7; }

.mode-panel { position: absolute; z-index: 4; top: max(58px, calc(env(safe-area-inset-top) + 49px)); left: 50%; transform: translateX(-50%); background: rgba(18,27,36,.84); color: #fff; padding: 8px 10px 9px; border-radius: 12px; border: 1px solid rgba(255,255,255,.17); text-align: center; width: max-content; max-width: min(94vw, 350px); }
.mode-title { font-size: 9px; letter-spacing: .06em; font-weight: 800; color: #c9d6e4; margin-bottom: 6px; }
#wheel-status { color: #9ec99e; margin-left: 4px; font-variant-numeric: tabular-nums; }
.mode-buttons { display: flex; gap: 5px; }
.mode-buttons button { border: 1px solid #6e7b88; color: #e7edf5; background: #34414d; padding: 9px 13px; border-radius: 8px; font-weight: 750; font-size: 12px; min-width: 69px; touch-action: manipulation; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.mode-buttons button.active { background: #f6c363; color: #222831; border-color: #ffe3a0; }
.mode-description { margin-top: 6px; font-size: 10px; color: #d7dee5; white-space: normal; max-width: 270px; }
@media (hover: hover) and (pointer: fine) { .mode-panel { top: max(66px, calc(env(safe-area-inset-top) + 55px)); } }
@media (max-height: 440px) { .mode-panel { top: max(4px, env(safe-area-inset-top)); padding: 5px 7px; } .mode-title, .mode-description { display: none; } .mode-buttons button { padding: 7px 10px; font-size: 11px; min-width: 64px; } }
@media (max-width: 540px) { .mode-buttons button { min-width: 58px; padding: 8px 8px; } }
    .message { position: absolute; z-index: 6; left: 50%; top: 50%; transform: translate(-50%,-50%); width: min(90vw, 520px); padding: 22px; background: #18232eea; color: #fff; text-align: center; border-radius: 14px; line-height: 1.6; box-shadow: 0 10px 35px #0005; }
    .message[hidden] { display: none; }
    .portrait-note { display: none; }
    @media (hover: hover) and (pointer: fine) {
      .touch-controls { display: none; }
    }
    @media (max-width: 700px) { .help { display: none; } .speed-card { padding: 7px 10px; } .restart { padding: 11px 12px; } }
    @media (orientation: portrait) and (pointer: coarse) {
      .portrait-note { position: absolute; inset: 0; z-index: 5; display: flex; justify-content: center; align-items: center; flex-direction: column; gap: 12px; background: #1d2935; color: white; font-weight: 700; text-align: center; padding: 30px; }
      .portrait-note .rotate-symbol { font-size: 55px; line-height: 1; }
    }
    @media (max-height: 420px) {
      .ctrl { --h: clamp(48px, 13vh, 62px); width: clamp(49px, 10vw, 67px); border-radius: 12px; }
      .touch-controls { bottom: max(6px, env(safe-area-inset-bottom)); }
      .restart { padding: 9px 10px; }
      .hud-actions { gap: 4px; }
      .audio-toggle { font-size: 12px; }
    }
  </style>
</head>
<body>
<main id="app">
  <canvas id="game" aria-label="Трёхмерная арена, автомобиль и управление"></canvas>
  <div class="hud">
    <div class="speed-card" aria-label="Скорость автомобиля"><span id="speed" class="speed-number">0</span><span class="speed-unit">км/ч</span><span id="gear" class="gear">N</span><span class="version">v0.5</span></div>
    <div class="hud-actions">
      <button id="audio-toggle" class="restart audio-toggle" type="button" aria-pressed="true" aria-label="Выключить звук">🔊 Звук</button>
      <button id="restart" class="restart" type="button">↻ Перезапуск</button>
    </div>
  </div>
  <div class="mode-panel" role="group" aria-label="Режим управления">
    <div class="mode-title">НАСТРОЙКА ФИЗИКИ <span id="wheel-status">○○○○</span></div>
    <div class="mode-buttons">
      <button type="button" data-preset="arcade">Arcade</button>
      <button type="button" data-preset="derby" class="active" aria-pressed="true">Derby</button>
      <button type="button" data-preset="drift">Drift</button>
    </div>
    <div id="mode-description" class="mode-description">Тяжёлый автомобиль · сбалансированное сцепление</div>
  </div>
  <div class="help">W/↑ газ · S/↓ тормоз/реверс · A D/← → руль · Space ручник · R рестарт · 1/2/3 режим</div>
  <div class="touch-controls" aria-label="Кнопки управления на телефоне">
    <div class="group">
      <button class="ctrl" data-control="left" type="button" aria-label="Влево">◀</button>
      <button class="ctrl" data-control="right" type="button" aria-label="Вправо">▶</button>
    </div>
    <div class="group">
      <button class="ctrl handbrake" data-control="handbrake" type="button" aria-label="Ручной тормоз">HB</button>
      <button class="ctrl brake" data-control="brake" type="button" aria-label="Тормоз">ТОРМОЗ</button>
      <button class="ctrl gas" data-control="gas" type="button" aria-label="Газ">ГАЗ</button>
    </div>
  </div>
  <div class="portrait-note"><span class="rotate-symbol">↻</span>Поверните телефон горизонтально,<br>чтобы начать заезд</div>
  <div id="message" class="message">Загрузка физического движка…</div>
</main>
<script type="module">
  // Single-file prototype: Three.js is fetched from the CDN. No bundler is needed.
  const showError = (message) => {
    const box = document.getElementById('message');
    box.textContent = message;
    box.hidden = false;
  };

  try {
    const [THREE, rapierModule] = await Promise.all([
      import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js'),
      import('https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.19.3/+esm'),
    ]);
    // rapier3d-compat contains WebAssembly in its JS file. It works with
    // plain HTML and GitHub Pages, without npm, a bundler, or a WASM server.
    const RAPIER = rapierModule.default?.World ? rapierModule.default : rapierModule;
    await RAPIER.init();
    document.getElementById('message').hidden = true;
    const canvas = document.getElementById('game');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
    renderer.setClearColor(0xb6c3cd);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xb6c3cd);
    const camera = new THREE.PerspectiveCamera(65, 1, 0.1, 230);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x607080, 2.1));
    const sun = new THREE.DirectionalLight(0xffffff, 2.0);
    sun.position.set(-18, 35, -22);
    scene.add(sun);

    const material = (color) => new THREE.MeshLambertMaterial({ color });
    const floorMat = material(0x9aa0a5);
    const wallMat = material(0x65707a);
    const curbMat = material(0x77838c);
    const yellowMat = material(0xe1a53e);
    const glassMat = material(0x415967);
    const rubberMat = material(0x25282d);
    const lampMat = material(0xf6e1a6);
    const redMat = material(0x9c3938);

    function block(parent, w, h, d, mat, x, y, z) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      mesh.position.set(x, y, z);
      parent.add(mesh);
      return mesh;
    }

    // The meshes are purely visual. Rapier owns all collision geometry.
    block(scene, 80, 0.5, 80, floorMat, 0, -0.25, 0);
    block(scene, 80.8, 1.8, 0.8, wallMat, 0, 0.9, -40.4);
    block(scene, 80.8, 1.8, 0.8, wallMat, 0, 0.9, 40.4);
    block(scene, 0.8, 1.8, 80.8, wallMat, -40.4, 0.9, 0);
    block(scene, 0.8, 1.8, 80.8, wallMat, 40.4, 0.9, 0);
    const grid = new THREE.GridHelper(80, 20, 0x8c969e, 0x8c969e);
    grid.position.y = 0.005;
    scene.add(grid);
    for (const x of [-36, 36]) for (const z of [-36, 36]) {
      block(scene, 2, 0.15, 2, curbMat, x, 0.075, z);
    }

    // ----------------- tuned raycast-wheel vehicle (same as v0.4.2) -----------------
    // All car parts are simple shapes. Local +Z is the nose; the physics
    // body's center is the car group's origin. Each wheel is visual only;
    // tire forces and suspension are calculated by Rapier raycasts.
    const car = new THREE.Group();
    scene.add(car);
    // Render-only pivot. Roll/pitch never enter Rapier and never move wheel rays.
    const visualBody = new THREE.Group();
    car.add(visualBody);
    block(visualBody, 2.0, 0.65, 4.18, yellowMat, 0, 0.05, 0);
    block(visualBody, 1.72, 0.72, 2.05, glassMat, 0, 0.73, -0.31);
    block(visualBody, 1.8, 0.16, 1.05, yellowMat, 0, 0.46, 1.52);
    for (const x of [-0.70, 0.70]) {
      block(visualBody, .4, .14, .08, lampMat, x, 0.17, 2.1);
      block(visualBody, .4, .14, .08, redMat, x, 0.17, -2.1);
    }
    block(visualBody, 1.9, .16, .13, rubberMat, 0, -0.20, 2.14);
    block(visualBody, 1.9, .16, .13, rubberMat, 0, -0.20, -2.14);

    const world = new RAPIER.World({ x: 0, y: -9.81, z: 0 });
    world.timestep = 1 / 60;
    // A static floor is required: four wheel rays must hit something solid.
    world.createCollider(RAPIER.ColliderDesc.cuboid(40, .25, 40)
      .setTranslation(0, -.25, 0).setFriction(0.95));
    const staticBox = (hx, hy, hz, x, y, z) => world.createCollider(
      RAPIER.ColliderDesc.cuboid(hx, hy, hz).setTranslation(x, y, z)
        .setRestitution(0.09).setFriction(0.8)
    );
    staticBox(40.4, .9, .4, 0, .9, -40.4);
    staticBox(40.4, .9, .4, 0, .9, 40.4);
    staticBox(.4, .9, 40.4, -40.4, .9, 0);
    staticBox(.4, .9, 40.4, 40.4, .9, 0);
    // Low corner blocks: optional bumps for experimenting with suspension.
    for (const x of [-36, 36]) for (const z of [-36, 36]) {
      staticBox(1, .075, 1, x, .075, z);
    }
    const carBody = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic()
      .setTranslation(0, 1.06, 0)
      .setLinearDamping(0.075)
      .setAngularDamping(0.30)
      .setCcdEnabled(true));
    // Explicit mass properties place the center of mass LOWER than the body
    // origin. Keeping the collider at its real location avoids an invisible
    // collision box shifted below the rendered car.
    // Inertias (kg m^2): X = pitch, Y = yaw, Z = roll.
    const CAR_MASS = 1040;
    const CENTER_OF_MASS_Y = -0.38;
    world.createCollider(RAPIER.ColliderDesc.cuboid(.95, .35, 2.06)
      .setMassProperties(
        CAR_MASS,
        { x:0, y:CENTER_OF_MASS_Y, z:0 },
        { x:1750, y:2200, z:1100 },
        { x:0, y:0, z:0, w:1 }
      ).setFriction(.62).setRestitution(.02), carBody);
    const carMass = carBody.mass();
    const vehicle = world.createVehicleController(carBody);
    // FIX v0.4.2: Rapier's raycast vehicle uses local +X as forward by default.
    // This project's car mesh and wheel positions use local +Z as the nose.
    // Without this, wheel traction is calculated along the WRONG axis.
    const forwardAxisSetter = Object.getOwnPropertyDescriptor(
      Object.getPrototypeOf(vehicle), 'setIndexForwardAxis');
    if (forwardAxisSetter?.set) vehicle.setIndexForwardAxis = 2;
    else if (typeof vehicle.setIndexForwardAxis === 'function') vehicle.setIndexForwardAxis(2);
    else vehicle.indexForwardAxis = 2;
    if (vehicle.indexForwardAxis !== 2) {
      throw new Error('Rapier: не удалось установить продольную ось Z автомобиля');
    }
    const WHEEL_RADIUS = .35;
    const WHEEL_REST_LENGTH = .32;
    const wheelAnchors = [
      { x:-.91,y:-.20,z: 1.36,front:true },
      { x: .91,y:-.20,z: 1.36,front:true },
      { x:-.91,y:-.20,z:-1.36,front:false },
      { x: .91,y:-.20,z:-1.36,front:false },
    ];
    const wheels = [];
    const tireGeometry = new THREE.CylinderGeometry(WHEEL_RADIUS,WHEEL_RADIUS,.29,12);
    tireGeometry.rotateZ(Math.PI/2);
    const hubGeometry = new THREE.CylinderGeometry(.15,.15,.31,12);
    hubGeometry.rotateZ(Math.PI/2);
    const hubMaterial = material(0x87909a);
    for (let i = 0; i < wheelAnchors.length; i++) {
      const anchor = wheelAnchors[i];
      vehicle.addWheel(
        { x:anchor.x, y:anchor.y, z:anchor.z },
        { x:0, y:-1, z:0 },
        { x:-1, y:0, z:0 },
        WHEEL_REST_LENGTH, WHEEL_RADIUS
      );
      vehicle.setWheelMaxSuspensionTravel(i, .20);
      vehicle.setWheelMaxSuspensionForce(i, 22000);
      const pivot = new THREE.Group();
      const spinner = new THREE.Group();
      spinner.add(new THREE.Mesh(tireGeometry, rubberMat));
      spinner.add(new THREE.Mesh(hubGeometry, hubMaterial));
      pivot.add(spinner);
      car.add(pivot);
      wheels.push({ anchor, pivot, spinner });
    }

    // Same physics objects as v0.3 to compare actual impacts. Unlike v0.3,
    // the blue block can now fall and rotate naturally in three dimensions.
    const boxMat = material(0x427eaa);
    const fixedMat = material(0xb45445);
    const movingMesh = block(scene, 2.4, 1.3, 2.4, boxMat, -5, .65, 16);
    block(scene, 3.4, 1.8, 3.4, fixedMat, 10, .9, 18);
    const movingBody = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic()
      .setTranslation(-5, .65, 16).setLinearDamping(.9)
      .setAngularDamping(1.3).setCcdEnabled(true));
    world.createCollider(RAPIER.ColliderDesc.cuboid(1.2,.65,1.2)
      .setDensity(35).setFriction(.72).setRestitution(.08), movingBody);
    staticBox(1.7,.9,1.7,10,.9,18);

    // Three deliberately different starting points, not final handling tuning.
    const PRESETS = Object.freeze({
      arcade: {
        name: 'Arcade', description: 'Быстрый отклик · устойчивое сцепление',
        engine: 4100, reverse: 2150, brake: 25, handbrake: 19,
        steer: .50, steerSpeed: 10.0, steerFade: .48, maxSpeed: 24,
        frontSide: 1.28, rearSide: 1.37, slip: 5.2,
        handbrakeRearSide: .48, handbrakeRearSlip: 1.1,
        spring: 36, compression: 4.0, relaxation: 4.4,
        downforce: 0, yawAssist: .60, uprightSpring: 7700, uprightDamping: 1900,
      },
      derby: {
        name: 'Derby', description: 'Бодрый разгон · тяжёлый и устойчивый кузов',
        engine: 3800, reverse: 1950, brake: 24, handbrake: 18,
        steer: .49, steerSpeed: 8.0, steerFade: .49, maxSpeed: 23,
        frontSide: 1.22, rearSide: 1.14, slip: 4.7,
        handbrakeRearSide: .34, handbrakeRearSlip: .92,
        spring: 34, compression: 4.3, relaxation: 4.7,
        downforce: 0, yawAssist: .36, uprightSpring: 6700, uprightDamping: 1700,
      },
      drift: {
        name: 'Drift', description: 'Мощнее двигатель · контролируемый занос',
        engine: 4400, reverse: 2050, brake: 22, handbrake: 17,
        steer: .55, steerSpeed: 9.0, steerFade: .36, maxSpeed: 25,
        frontSide: 1.32, rearSide: .84, slip: 4.0,
        handbrakeRearSide: .25, handbrakeRearSlip: .65,
        spring: 35, compression: 4.2, relaxation: 4.5,
        downforce: 0, yawAssist: .08, uprightSpring: 5800, uprightDamping: 1500,
      },
    });
    let selectedPreset = 'derby';
    let drive = PRESETS[selectedPreset];
    const modeDescription = document.getElementById('mode-description');
    const wheelStatus = document.getElementById('wheel-status');
    function selectPreset(id) {
      if (!PRESETS[id]) return;
      selectedPreset = id;
      drive = PRESETS[id];
      modeDescription.textContent = drive.description;
      document.querySelectorAll('[data-preset]').forEach(button => {
        const selected = button.dataset.preset === id;
        button.classList.toggle('active', selected);
        button.setAttribute('aria-pressed', String(selected));
      });
      for (let i=0;i<4;i++) {
        vehicle.setWheelSuspensionStiffness(i, drive.spring);
        vehicle.setWheelSuspensionCompression(i, drive.compression);
        vehicle.setWheelSuspensionRelaxation(i, drive.relaxation);
        vehicle.setWheelFrictionSlip(i, drive.slip);
        vehicle.setWheelSideFrictionStiffness(i, i < 2 ? drive.frontSide : drive.rearSide);
      }
    }
    document.querySelectorAll('[data-preset]').forEach(button => {
      button.addEventListener('click', () => selectPreset(button.dataset.preset));
    });
    selectPreset(selectedPreset);

    // Lightweight synthesized sound: no samples and no external audio assets.
    const audioButton = document.getElementById('audio-toggle');
    const audio = {
      enabled: true, ctx: null, master: null, engine: null,
      bass: null, engineGain: null, bassGain: null, tyreGain: null,
      hissSource: null, impactCooldown: 0,
    };
    const setSoundUI = () => {
      audioButton.textContent = audio.enabled ? '🔊 Звук' : '🔇 Звук';
      audioButton.setAttribute('aria-pressed', String(audio.enabled));
      audioButton.setAttribute('aria-label', audio.enabled ? 'Выключить звук' : 'Включить звук');
    };
    function createNoiseBuffer(ctx) {
      const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate), ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      return buffer;
    }
    function unlockSound() {
      if (!audio.enabled) return;
      const Context = window.AudioContext || window.webkitAudioContext;
      if (!Context) {
        audio.enabled = false;
        setSoundUI();
        return;
      }
      if (!audio.ctx) {
        try {
          const ctx = audio.ctx = new Context();
          const master = audio.master = ctx.createGain();
          master.gain.value = 0.20;
          master.connect(ctx.destination);

          const engineFilter = ctx.createBiquadFilter();
          engineFilter.type = 'lowpass';
          engineFilter.frequency.value = 420;
          engineFilter.Q.value = 0.7;
          engineFilter.connect(master);
          const engine = audio.engine = ctx.createOscillator();
          engine.type = 'sawtooth';
          const engineGain = audio.engineGain = ctx.createGain();
          engineGain.gain.value = 0;
          engine.connect(engineGain).connect(engineFilter);
          engine.start();
          const bass = audio.bass = ctx.createOscillator();
          bass.type = 'triangle';
          const bassGain = audio.bassGain = ctx.createGain();
          bassGain.gain.value = 0;
          bass.connect(bassGain).connect(engineFilter);
          bass.start();

          const hissFilter = ctx.createBiquadFilter();
          hissFilter.type = 'bandpass';
          hissFilter.frequency.value = 1200;
          hissFilter.Q.value = 0.6;
          const tyreGain = audio.tyreGain = ctx.createGain();
          tyreGain.gain.value = 0;
          hissFilter.connect(tyreGain).connect(master);
          const hiss = audio.hissSource = ctx.createBufferSource();
          hiss.buffer = createNoiseBuffer(ctx);
          hiss.loop = true;
          hiss.connect(hissFilter);
          hiss.start();
        } catch (error) {
          console.warn('Audio unavailable:', error);
          audio.enabled = false;
          if (audio.ctx) audio.ctx.close().catch(() => {});
          audio.ctx = null;
          setSoundUI();
          return;
        }
      }
      if (audio.ctx.state === 'suspended') audio.ctx.resume().catch(() => {});
    }
    function playImpact(severity) {
      if (!audio.enabled || !audio.ctx || audio.ctx.state !== 'running') return;
      if (audio.impactCooldown > 0) return;
      audio.impactCooldown = 0.22;
      const ctx = audio.ctx;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      const intensity = Math.min(1, severity / 7);
      osc.frequency.setValueAtTime(170 - intensity * 60, now);
      osc.frequency.exponentialRampToValueAtTime(42, now + 0.17);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.35 * intensity + 0.06, now + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.connect(gain).connect(audio.master);
      osc.start(now);
      osc.stop(now + 0.22);
      osc.onended = () => { osc.disconnect(); gain.disconnect(); };
    }
    function updateSound(dt, forwardSpeed, slip, hasContact) {
      audio.impactCooldown = Math.max(0, audio.impactCooldown - dt);
      if (!audio.ctx || !audio.enabled || audio.ctx.state !== 'running') return;
      const ctx = audio.ctx;
      const t = ctx.currentTime;
      const rev = Math.min(1, Math.abs(forwardSpeed) / 25);
      const throttle = held('gas') ? 1 : held('brake') ? .22 : .08;
      // Throttle bumps RPM while free-wheeling never falls silent.
      const hz = 46 + rev * 111 + throttle * 23;
      audio.engine.frequency.setTargetAtTime(hz, t, .055);
      audio.bass.frequency.setTargetAtTime(hz / 2, t, .07);
      audio.engineGain.gain.setTargetAtTime(.12 + rev * .075 + throttle * .08, t, .085);
      audio.bassGain.gain.setTargetAtTime(.12 + throttle * .035, t, .08);
      audio.tyreGain.gain.setTargetAtTime(hasContact ? Math.min(.22, slip * .09) : 0, t, .06);
    }
    audioButton.addEventListener('click', () => {
      audio.enabled = !audio.enabled;
      if (audio.enabled) unlockSound();
      if (audio.master && audio.ctx) audio.master.gain.setTargetAtTime(audio.enabled ? .20 : 0, audio.ctx.currentTime, .025);
      setSoundUI();
    });
    setSoundUI();

    const speedEl = document.getElementById('speed');
    const gearEl = document.getElementById('gear');
    const keyActions = new Set();
    const pointerActions = new Map();
    const keyToControl = {
      KeyW: 'gas', ArrowUp: 'gas', KeyS: 'brake', ArrowDown: 'brake',
      KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right',
      Space: 'handbrake',
    };
    const held = (action) => keyActions.has(action) || [...pointerActions.values()].includes(action);
    function clearInput() {
      keyActions.clear(); pointerActions.clear();
      document.querySelectorAll('[data-control]').forEach(button => button.classList.remove('pressed'));
    }
    window.addEventListener('keydown', event => {
      if (!event.repeat && (event.code in keyToControl)) unlockSound();
      if (event.code === 'KeyR') { event.preventDefault(); if (!event.repeat) resetCar(); return; }
      if (event.code === 'Digit1') { if (!event.repeat) selectPreset('arcade'); return; }
      if (event.code === 'Digit2') { if (!event.repeat) selectPreset('derby'); return; }
      if (event.code === 'Digit3') { if (!event.repeat) selectPreset('drift'); return; }
      const action = keyToControl[event.code];
      if (action) { event.preventDefault(); keyActions.add(action); }
    });
    window.addEventListener('keyup', event => {
      const action = keyToControl[event.code];
      if (action) { event.preventDefault(); keyActions.delete(action); }
    });
    window.addEventListener('blur', clearInput);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clearInput();
        if (audio.ctx && audio.ctx.state === 'running') audio.ctx.suspend().catch(() => {});
      }
    });
    document.querySelectorAll('[data-control]').forEach(button => {
      const action = button.dataset.control;
      const endPointer = (event) => {
        if (pointerActions.get(event.pointerId) !== action) return;
        pointerActions.delete(event.pointerId);
        button.classList.remove('pressed');
      };
      button.addEventListener('pointerdown', event => {
        event.preventDefault();
        unlockSound();
        button.setPointerCapture(event.pointerId);
        pointerActions.set(event.pointerId, action);
        button.classList.add('pressed');
      });
      button.addEventListener('pointerup', endPointer);
      button.addEventListener('pointercancel', endPointer);
      button.addEventListener('lostpointercapture', endPointer);
      button.addEventListener('contextmenu', event => event.preventDefault());
    });
    document.getElementById('restart').addEventListener('click', () => { clearInput(); resetCar(); });

    const position = new THREE.Vector3();
    const forward = new THREE.Vector3(0,0,1);
    const carQuaternion = new THREE.Quaternion();
    const cameraDesired = new THREE.Vector3();
    const cameraTarget = new THREE.Vector3();
    const upright = new THREE.Vector3();
    let steering = 0;
    let smoothedBrake = 0;
    let reverseEngaged = false;
    let wheelContacts = 0;

    // Draw tire marks with one pooled LineSegments geometry (no per-frame GPU objects).
    const MAX_SKID_SEGMENTS = 420;
    const skidPositions = new Float32Array(MAX_SKID_SEGMENTS * 6);
    const skidGeometry = new THREE.BufferGeometry();
    skidGeometry.setAttribute('position', new THREE.BufferAttribute(skidPositions, 3).setUsage(THREE.DynamicDrawUsage));
    skidGeometry.setDrawRange(0, 0);
    const skidMesh = new THREE.LineSegments(skidGeometry,
      new THREE.LineBasicMaterial({color:0x363b3e,transparent:true,opacity:0.48,depthWrite:false}));
    skidMesh.frustumCulled = false;
    scene.add(skidMesh);
    let skidWrite = 0, skidCount = 0, skidFrame = 0;
    const lastSkid = [new THREE.Vector3(), new THREE.Vector3()];
    const hasLastSkid = [false, false];
    const wheelWorld = new THREE.Vector3();
    const rightAxis = new THREE.Vector3();
    const dustCanvas = document.createElement('canvas');
    dustCanvas.width = dustCanvas.height = 48;
    const dustContext = dustCanvas.getContext('2d');
    const dustGradient = dustContext.createRadialGradient(24,24,2,24,24,24);
    dustGradient.addColorStop(0,'rgba(210,208,198,0.65)');
    dustGradient.addColorStop(1,'rgba(210,208,198,0)');
    dustContext.fillStyle=dustGradient;
    dustContext.fillRect(0,0,48,48);
    const dustTexture = new THREE.CanvasTexture(dustCanvas);
    const dustPuffs = Array.from({length: 18}, () => {
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map:dustTexture,transparent:true,opacity:0,depthWrite:false,
      }));
      sprite.visible = false;
      scene.add(sprite);
      return {sprite, life:0, age:0, vx:0, vy:0, vz:0};
    });
    let dustNext = 0;
    let rollTarget=0, pitchTarget=0;
    let slipAmount=0, latestSpeed=0;
    function rearWheelWorld(i) {
      const a = wheels[i].anchor;
      const extension = vehicle.wheelSuspensionLength(i) ?? WHEEL_REST_LENGTH;
      wheelWorld.set(a.x, a.y - extension - WHEEL_RADIUS, a.z)
        .applyQuaternion(carQuaternion).add(position);
      wheelWorld.y = .042;
      return wheelWorld;
    }
    function appendSkidSegment(a,b) {
      const distanceSq = a.distanceToSquared(b);
      if (distanceSq > 1.8 || distanceSq < .00001) return;
      const index = skidWrite * 6;
      skidPositions.set([a.x,.028,a.z,b.x,.028,b.z],index);
      skidWrite = (skidWrite+1) % MAX_SKID_SEGMENTS;
      skidCount = Math.min(MAX_SKID_SEGMENTS, skidCount + 1);
      skidGeometry.setDrawRange(0, skidCount * 2);
      skidGeometry.attributes.position.needsUpdate = true;
    }
    function spawnDust(location, velocity) {
      const d = dustPuffs[dustNext];
      dustNext=(dustNext+1)%dustPuffs.length;
      d.life=.55;
      d.age=0;
      d.vx=velocity.x*.23+(Math.random()-.5)*.9;
      d.vy=.5+Math.random()*.5;
      d.vz=velocity.z*.23+(Math.random()-.5)*.9;
      d.sprite.position.set(location.x,.13,location.z);
      d.sprite.scale.set(.55,.55,.55);
      d.sprite.visible=true;
    }
    function updateDust(dt) {
      for (const p of dustPuffs) {
        if (!p.sprite.visible) continue;
        p.age += dt;
        if (p.age>=p.life) {p.sprite.visible=false;continue;}
        const remain = 1-p.age/p.life;
        p.sprite.position.x += p.vx*dt;
        p.sprite.position.y += p.vy*dt;
        p.sprite.position.z += p.vz*dt;
        const size=.5+p.age*1.6;
        p.sprite.scale.set(size,size,size);
        p.sprite.material.opacity=.34*remain*remain;
      }
    }
    function updateSkids() {
      skidFrame++;
      if (skidFrame%2!==0) return;
      const active = wheelContacts>1 && latestSpeed>4 && slipAmount>.17;
      const currentVel = carBody.linvel();
      for (let j=0;j<2;j++) {
        const i = j+2;
        if (!active || !vehicle.wheelIsInContact(i)) {hasLastSkid[j]=false;continue;}
        const point = rearWheelWorld(i);
        if (hasLastSkid[j]) appendSkidSegment(lastSkid[j],point);
        lastSkid[j].copy(point);
        hasLastSkid[j]=true;
        if (skidFrame%4===0) spawnDust(point,currentVel);
      }
    }
    function resetEffects() {
      rollTarget=pitchTarget=slipAmount=latestSpeed=0;
      visualBody.rotation.set(0,0,0);
      skidPositions.fill(0);
      skidWrite=0;skidCount=0;skidFrame=0;
      skidGeometry.setDrawRange(0,0);
      skidGeometry.attributes.position.needsUpdate=true;
      hasLastSkid.fill(false);
      for(const p of dustPuffs){p.sprite.visible=false;p.age=0;}
      if (audio.ctx && audio.ctx.state==='running') {
        audio.tyreGain.gain.setTargetAtTime(0,audio.ctx.currentTime,.02);
      }
    }
    function updateVisualBody(dt) {
      const k = 1-Math.exp(-8.5*dt);
      visualBody.rotation.z += (rollTarget-visualBody.rotation.z)*k;
      visualBody.rotation.x += (pitchTarget-visualBody.rotation.x)*k;
      updateDust(dt);
    }

    function syncBodies() {
      const t = carBody.translation();
      const q = carBody.rotation();
      position.set(t.x, t.y, t.z);
      carQuaternion.set(q.x,q.y,q.z,q.w);
      car.position.copy(position);
      car.quaternion.copy(carQuaternion);
      forward.set(0,0,1).applyQuaternion(carQuaternion);
      const pitchSin = forward.y;
      forward.y = 0;
      if (forward.lengthSq() > .001) forward.normalize();
      for (let i=0; i < 4; i++) {
        const w = wheels[i], a = w.anchor;
        const len = vehicle.wheelSuspensionLength(i) ?? WHEEL_REST_LENGTH;
        w.pivot.position.set(a.x,a.y-len,a.z);
        // The pivot steers, the tire rolls. Steering is physical, not cosmetic.
        w.pivot.rotation.y = vehicle.wheelSteering(i) ?? 0;
        w.spinner.rotation.x = -(vehicle.wheelRotation(i) ?? 0);
      }
      const mt=movingBody.translation(), mq=movingBody.rotation();
      movingMesh.position.set(mt.x,mt.y,mt.z);
      movingMesh.quaternion.set(mq.x,mq.y,mq.z,mq.w);
      const v=carBody.linvel();
      const speedAlong=v.x*forward.x+v.z*forward.z;
      speedEl.textContent=String(Math.round(Math.hypot(v.x,v.z)*3.6));
      gearEl.textContent=speedAlong>.35?'D':speedAlong<-.35?'R':reverseEngaged?'R':'N';
      wheelContacts=0;
      for(let i=0;i<4;i++) if(vehicle.wheelIsInContact(i)) wheelContacts++;
      const incline = Math.asin(Math.min(1,Math.max(-1,pitchSin))) * 180 / Math.PI;
      wheelStatus.textContent=`●${wheelContacts}/4 · Y${t.y.toFixed(2)} · P${incline.toFixed(0)}°`;
      wheelStatus.title='Контакт колёс · высота кузова · наклон по тангажу';
    }

    function resetCar() {
      clearInput();
      carBody.setTranslation({x:0,y:1.06,z:0},true);
      carBody.setRotation({x:0,y:0,z:0,w:1},true);
      carBody.setLinvel({x:0,y:0,z:0},true);
      carBody.setAngvel({x:0,y:0,z:0},true);
      movingBody.setTranslation({x:-5,y:.65,z:16},true);
      movingBody.setRotation({x:0,y:0,z:0,w:1},true);
      movingBody.setLinvel({x:0,y:0,z:0},true);
      movingBody.setAngvel({x:0,y:0,z:0},true);
      for(let i=0;i<4;i++) {
        vehicle.setWheelEngineForce(i,0);
        vehicle.setWheelBrake(i,0);
        vehicle.setWheelSteering(i,0);
      }
      steering=0;
      resetEffects();
      smoothedBrake=0;
      reverseEngaged=false;
      carBody.wakeUp();
      syncBodies();
      camera.position.set(0,9.4,-13.5);
      camera.lookAt(0,1.3,2);
    }
    resetCar();

    function simulate(dt) {
      const gas=held('gas'), brake=held('brake'), hb=held('handbrake');
      const desiredSteer=(held('right')?1:0)-(held('left')?1:0);
      steering+=(desiredSteer-steering)*(1-Math.exp(-drive.steerSpeed*dt));

      const rotation=carBody.rotation();
      carQuaternion.set(rotation.x,rotation.y,rotation.z,rotation.w);
      forward.set(0,0,1).applyQuaternion(carQuaternion);
      const frontPitch = forward.y; // negative when nose dives
      forward.y=0;
      if (forward.lengthSq()>.0001) forward.normalize();
      const vel=carBody.linvel();
      const fwdSpeed=vel.x*forward.x+vel.z*forward.z;
      const horizontalSpeed=Math.hypot(vel.x,vel.z);
      const oldVelX=vel.x,oldVelY=vel.y,oldVelZ=vel.z;
      let engine=0, footBrake=0;
      reverseEngaged=false;
      // Automatic reverse: S first brakes, then reverses at walking speed.
      if (gas && brake) {
        footBrake=drive.brake;
      } else if (gas) {
        if (fwdSpeed<-.75) footBrake=drive.brake;
        else engine=drive.engine * Math.max(0, Math.min(1,(drive.maxSpeed-fwdSpeed)/3.5));
      } else if (brake) {
        if (fwdSpeed>.75) footBrake=drive.brake;
        else {
          reverseEngaged=true;
          engine=fwdSpeed< -7 ? 0 : -drive.reverse;
        }
      } else {
        // Gentle rolling resistance, NOT the near-emergency brake from v0.4.
        footBrake=0.8;
      }
      if (hb) engine*=.60;
      // Arcade brake assist: if the nose is already dipping steeply,
      // temporarily release part of the foot brake to prevent an endo.
      if (brake && fwdSpeed>2 && frontPitch < -0.10) {
        const risk = Math.min(1,(-frontPitch-0.10)/0.16);
        footBrake *= (1-0.65*risk);
      }
      // A short ramp avoids a one-frame impulse spike when the player brakes.
      smoothedBrake += (footBrake-smoothedBrake)*(1-Math.exp(-12*dt));
      // Steering fades gradually with speed; no direct yaw impulse is used.
      const speedRatio=Math.min(1,horizontalSpeed/drive.maxSpeed);
      const steeringAngle=-steering*drive.steer*(1-drive.steerFade*speedRatio);
      for(let i=0;i<4;i++) {
        vehicle.setWheelSteering(i,i<2?steeringAngle:0);
        // Rear-wheel drive. The front tires only steer and brake.
        vehicle.setWheelEngineForce(i,i>=2?engine:0);
        // Rapier's brake value is IMPULSE PER WHEEL (per step), not newtons.
        // The v0.4 values ~200 stopped the car almost instantly and flipped it.
        // Bias the foot brake toward the front, but keep rear brake available.
        const serviceBrake = smoothedBrake * (i < 2 ? 1.12 : 0.78);
        vehicle.setWheelBrake(i, i>=2 && hb ? drive.handbrake : serviceBrake);
        vehicle.setWheelSideFrictionStiffness(i,i<2 ? drive.frontSide :
          hb ? drive.handbrakeRearSide : drive.rearSide);
        vehicle.setWheelFrictionSlip(i,i>=2&&hb?drive.handbrakeRearSlip:drive.slip);
      }
      // updateVehicle applies wheel/suspension forces to the dynamic body.
      // Exclude dynamic bodies from wheel rays: no self-hit on the chassis.
      carBody.wakeUp();
      vehicle.updateVehicle(dt,RAPIER.QueryFilterFlags.EXCLUDE_DYNAMIC);
      // Mild speed-related aerodynamic load; real collisions remain free.
      if(wheelContacts>0 && horizontalSpeed>3) {
        carBody.addForce({x:0,y:-drive.downforce*horizontalSpeed*horizontalSpeed,z:0},true);
      }
      // Gentle arcade chassis stabilization in PITCH and ROLL only.
      // Unlike freezing rotations, this keeps impacts, suspension travel and
      // natural body lean while helping the car settle after strong braking.
      // The stabilizer acts only when wheels touch the ground, not in mid-air.
      if (wheelContacts>=2) {
        const currentQ = carBody.rotation();
        carQuaternion.set(currentQ.x,currentQ.y,currentQ.z,currentQ.w);
        upright.set(0,1,0).applyQuaternion(carQuaternion);
        const angular = carBody.angvel();
        carBody.addTorque({
          x: drive.uprightSpring * (-upright.z) - drive.uprightDamping * angular.x,
          y: 0,
          z: drive.uprightSpring * upright.x - drive.uprightDamping * angular.z,
        }, true);
      }
      // Small yaw damping assist in the easy modes, not a scripted turn.
      if(wheelContacts>0 && !hb && Math.abs(steering)<.30 && drive.yawAssist>0) {
        const angular=carBody.angvel();
        carBody.applyTorqueImpulse({x:0,y:-angular.y*carMass*.22*drive.yawAssist*dt,z:0},true);
      }
      world.step();
      syncBodies();
      const after=carBody.linvel();
      const dvX=after.x-oldVelX, dvY=after.y-oldVelY, dvZ=after.z-oldVelZ;
      const impulseSpeed=Math.hypot(dvX,dvY,dvZ);
      if (impulseSpeed>1.35 && horizontalSpeed>2.5) playImpact(impulseSpeed);
      rightAxis.set(1,0,0).applyQuaternion(carQuaternion);
      rightAxis.y=0;
      if (rightAxis.lengthSq()>.01) rightAxis.normalize();
      const lateralSpeed=after.x*rightAxis.x+after.z*rightAxis.z;
      const sideAccel=(dvX*rightAxis.x+dvZ*rightAxis.z)/dt;
      const longAccel=(dvX*forward.x+dvZ*forward.z)/dt;
      const currentSpeed=Math.hypot(after.x,after.z);
      latestSpeed=currentSpeed;
      slipAmount=wheelContacts>1 ? Math.min(1.5, Math.abs(lateralSpeed)/Math.max(2,currentSpeed)*3.3 +
        (hb && currentSpeed>5 ? .52 : 0)) : 0;
      // Fake lean affects only the visible body; Rapier chassis and wheels do not tilt.
      rollTarget=THREE.MathUtils.clamp(steering*Math.min(1,currentSpeed/11)*.045 + sideAccel*.003, -.095, .095);
      pitchTarget=THREE.MathUtils.clamp((brake ? .038 : gas ? -.025 : 0)-longAccel*.003, -.072, .085);
      updateSkids();
      updateSound(dt,after.x*forward.x+after.z*forward.z,slipAmount,wheelContacts>1);
      if (carBody.translation().y < -5) resetCar();
    }

    // Camera follows the actual rigid-body pose after each physics step.
    const clock = new THREE.Clock();
    let accumulator = 0;
    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      if (!width || !height) return;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resize);
    resize();
    function frame() {
      try {
      const delta = Math.min(clock.getDelta(), 0.05);
      accumulator += delta;
      const fixedDt = 1 / 60;
      let updates = 0;
      while (accumulator >= fixedDt && updates < 4) {
        simulate(fixedDt);
        accumulator -= fixedDt;
        updates++;
      }
      if (updates === 4) accumulator = 0;
      updateVisualBody(delta);
      cameraDesired.set(position.x - forward.x * 12.5, position.y + 7.5, position.z - forward.z * 12.5);
      camera.position.lerp(cameraDesired, 1 - Math.exp(-4.8 * delta));
      cameraTarget.set(position.x + forward.x * 3.5, position.y + .4, position.z + forward.z * 3.5);
      camera.lookAt(cameraTarget);
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
      } catch (error) {
        console.error('Wreck Circuit: physics update failed', error);
        showError('Ошибка физики: ' + (error?.message || String(error)) + '. Сообщи мне текст ошибки.');
      }
    }
    frame();
  } catch (error) {
    console.error('Wreck Circuit startup failed:', error);
    showError('Не удалось запустить 3D-сцену v0.5: ' + (error?.message || String(error)));
  }
</script>
</body>
</html>
