let yaw=.78,elevation=.27,zoom=1,mode='orbit';function pose(){const target=new T.Vector3(0,.72,0),dist=12;camera.position.set(dist*Math.sin(yaw)*Math.cos(elevation),.72+dist*Math.sin(elevation),dist*Math.cos(yaw)*Math.cos(elevation));camera.up.set(0,1,0);camera.lookAt(target);const view=document.querySelector('#view');const a=Math.max(1,view.clientWidth)/Math.max(1,view.clientHeight);const v=Math.max(2.05,3.25/a)/zoom;camera.left=-v*a;camera.right=v*a;camera.top=v;camera.bottom=-v;camera.updateProjectionMatrix()}function resize(){const v=document.querySelector('#view');renderer.setSize(Math.max(1,v.clientWidth),Math.max(1,v.clientHeight),false);pose()}addEventListener('resize',resize);if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe(document.querySelector('#view'));resize();function setView(v){mode=v;const vals={orbit:[.78,.27],side:[Math.PI/2,0],front:[0,0],rear:[Math.PI,0],top:[0,Math.PI/2-.0001]};[yaw,elevation]=vals[v];document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));pose()}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));const pointers=new Map();let pinch=0;const el=renderer.domElement;el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);pinch=0});el.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const old=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1){yaw-=(e.clientX-old[0])*.008;elevation=clamp(elevation+(e.clientY-old[1])*.006,-.15,1.48);mode='orbit';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view==='orbit'))}else{const [a,b]=[...pointers.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)zoom=clamp(zoom*d/pinch,.6,2.6);pinch=d}pose()});for(const e of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(e,x=>{pointers.delete(x.pointerId);pinch=0});el.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom*Math.exp(-e.deltaY*.001),.6,2.6);pose()},{passive:false});for(const [id,d] of [['zoomIn',1.2],['zoomOut',1/1.2]])document.getElementById(id).onclick=()=>{zoom=clamp(zoom*d,.6,2.6);pose()};for(const [id,fn] of [['wire',()=>{wire=!wire;setWire();return wire}],['doors',()=>{openDoors=!openDoors;updateParts();return openDoors}],['hood',()=>{openHood=!openHood;updateParts();return openHood}],['trunk',()=>{openTrunk=!openTrunk;updateParts();return openTrunk}]])document.getElementById(id).onclick=e=>e.currentTarget.classList.toggle('active',fn());document.querySelector('#settings').onclick=()=>{const p=document.querySelector('#panel');p.hidden=!p.hidden};for(const [id,out] of [['frontGap','of'],['rearGap','or'],['height','oh']])document.getElementById(id).oninput=e=>{cfg[id]=Number(e.target.value)/1000;document.getElementById(out).value=e.target.value;build()};document.querySelector('#paintColor').oninput=e=>paint.color.set(e.target.value);document.querySelector('#reset').onclick=()=>{for(const [id,val] of [['frontGap',65],['rearGap',40],['height',0]]){const e=document.getElementById(id);e.value=val;e.oninput({target:e})}};renderer.setAnimationLoop(()=>renderer.render(scene,camera));
}catch(e){console.error(e);document.querySelector('#error').style.display='block';document.querySelector('#error').textContent='Ошибка запуска: '+e.message}
</script></body></html>
